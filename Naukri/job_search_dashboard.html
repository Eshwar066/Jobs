<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job match → Excel</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222d;
      --border: #2a3544;
      --text: #e8eef6;
      --muted: #8b9bb0;
      --accent: #3d8bfd;
      --accent-text: #dbeafe;
      --ok: #34d399;
      --danger: #f87171;
      --danger-bg: #3f1d1d;
      --radius: 10px;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 0%, #1a2f28 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.25rem 3rem;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; line-height: 1.45; }
    .card {
      margin-top: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 0.75rem; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    input, select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #121820;
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn-row { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
    button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0.7rem 1.35rem;
      border-radius: var(--radius);
      border: 1px solid #2563eb;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 1rem;
      padding: 0.9rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #121820;
      font-size: 0.9rem;
      color: var(--muted);
      display: none;
      align-items: center;
      gap: 10px;
    }
    .status.show { display: flex; }
    .status.ok { color: var(--ok); border-color: #14532d; }
    .status.err { color: var(--danger); background: var(--danger-bg); border-color: #7f1d1d; }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    code { font-size: 0.78rem; background: #121820; padding: 0.15rem 0.4rem; border-radius: 4px; }
    @media (max-width: 560px) {
      .grid, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Job match → Excel</h1>
    <p class="sub">Runs LinkedIn &amp; Naukri via Apify, ranks roles against your resume skills, and downloads an Excel file with apply links — no job list in the UI.</p>

    <div class="card">
      <div class="field">
        <label>Apify API key</label>
        <input type="password" id="apiKey" placeholder="apify_api_..." value="apify_api_dvtc41BdMxOSQGhJH5zgKdNtft9B1s2TPxeO" />
      </div>
      <div class="grid">
        <div class="field">
          <label>Keywords</label>
          <input type="text" id="keywords" value="React TypeScript Frontend Engineer" />
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="location" value="Bengaluru" />
        </div>
      </div>
      <div class="grid-3">
        <div class="field">
          <label>Experience</label>
          <select id="experience">
            <option value="">Any</option>
            <option value="0-2">0–2 years</option>
            <option value="2-5" selected>2–5 years</option>
            <option value="5-8">5–8 years</option>
            <option value="8+">8+ years</option>
          </select>
        </div>
        <div class="field">
          <label>Posted within</label>
          <select id="datePosted">
            <option value="24h" selected>Last 24 hours</option>
            <option value="3d">Last 3 days</option>
            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
          </select>
        </div>
        <div class="field">
          <label>Source</label>
          <select id="source">
            <option value="both" selected>Both</option>
            <option value="linkedin">LinkedIn only</option>
            <option value="naukri">Naukri only</option>
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button id="searchBtn" type="button">Find matches &amp; download Excel</button>
      </div>
      <div id="status" class="status" role="status"></div>
      <p class="hint">Prefer CLI? Run <code>python find_matching_jobs.py</code> in this folder — same matching logic, writes <code>matched_jobs_*.xlsx</code>.</p>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
const MY_SKILLS = ['react', 'typescript', 'redux', 'redux toolkit', 'module federation', 'micro-frontend', 'microfrontend', 'webpack', 'webpack 5', 'javascript', 'tailwind', 'zustand', 'context api', 'websocket', 'monorepo', 'styled components', 'scss', 'mui', 'figma', 'git'];
const MY_TITLES = ['frontend', 'front-end', 'front end', 'react', 'typescript', 'ui engineer', 'sde ii', 'sde 2', 'software engineer', 'ui developer'];
const MIN_MATCH = 25;
const TOP_N = 40;

function jobSkills(job) {
  let skills = job.skills || job.tagsAndSkills || [];
  if (typeof skills === 'string') {
    skills = skills.replace(/\|/g, ',').split(',').map(s => s.trim()).filter(Boolean);
  }
  return Array.isArray(skills) ? skills : [];
}

function jobText(job) {
  return [
    job.title || job.jobTitle,
    job.description || job.jobDescription,
    jobSkills(job).join(' '),
    job.company || job.companyName
  ].join(' ').toLowerCase();
}

function getMatchScore(job) {
  const text = jobText(job);
  let matches = 0;
  MY_SKILLS.forEach(s => { if (text.includes(s)) matches++; });
  return Math.round((matches / MY_SKILLS.length) * 100);
}

function getMatchingSkills(job) {
  const text = jobText(job);
  return MY_SKILLS.filter(s => text.includes(s));
}

function titleBoost(job) {
  const title = (job.title || job.jobTitle || '').toLowerCase();
  return MY_TITLES.some(t => title.includes(t)) ? 15 : 0;
}

function applyUrl(job) {
  let url = job.jobURL || job.jobUrl || job.url || job.applyUrl || job.link || '';
  if (!url && job.jdURL) {
    url = String(job.jdURL).startsWith('http') ? job.jdURL : ('https://www.naukri.com' + job.jdURL);
  }
  return url;
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.className = 'status show' + (kind ? ' ' + kind : '');
  el.innerHTML = kind === 'ok' || kind === 'err'
    ? msg
    : `<span class="spinner"></span><span>${msg}</span>`;
}

async function runLinkedIn(apiKey, keywords, location, datePosted) {
  const dateMap = { '24h': 'past24Hours', '3d': 'pastWeek', '7d': 'pastWeek', '30d': 'pastMonth' };
  const resp = await fetch(
    `https://api.apify.com/v2/acts/curious_coder~linkedin-jobs-scraper/run-sync-get-dataset-items?token=${apiKey}&timeout=120&memory=1024`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        searchQueries: [keywords + ' ' + location],
        location: location + ', India',
        dateSincePosted: dateMap[datePosted] || 'past24Hours',
        maxResults: 40,
        proxy: { useApifyProxy: true }
      })
    }
  );
  if (!resp.ok) throw new Error('LinkedIn actor failed: ' + resp.status);
  const data = await resp.json();
  return Array.isArray(data) ? data : [];
}

async function runNaukri(apiKey, keywords, location, experience) {
  const expMap = { '2-5': '2-5', '0-2': '0-2', '5-8': '5-8', '8+': '8-20' };
  const expStr = expMap[experience] || '2-5';
  const slug = keywords.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  const locSlug = location.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const naukriUrl = `https://www.naukri.com/${slug}-jobs-in-${locSlug}?experience=${expStr}&jobAge=1`;

  const resp = await fetch(
    `https://api.apify.com/v2/acts/epicscrapers~naukri-scraper/run-sync-get-dataset-items?token=${apiKey}&timeout=120&memory=1024`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        startUrls: [{ url: naukriUrl }],
        maxItems: 40,
        proxy: { useApifyProxy: true }
      })
    }
  );
  if (!resp.ok) throw new Error('Naukri actor failed: ' + resp.status);
  const data = await resp.json();
  return Array.isArray(data) ? data : [];
}

function normalize(job, source) {
  const title = job.title || job.jobTitle || '';
  if (!title) return null;
  const skillScore = getMatchScore(job);
  const score = Math.min(100, skillScore + titleBoost(job));
  let exp = job.experienceLabel || job.experience || job.minExperience || '';
  if (!exp && (job.minimumExperience || job.maximumExperience)) {
    exp = `${job.minimumExperience || ''}-${job.maximumExperience || ''} Yrs`;
  }
  return {
    'Match %': score,
    'Matched skills': getMatchingSkills(job).join(', '),
    'Job title': title,
    'Company': job.company || job.companyName || '',
    'Location': job.location || job.locationLabel || job.jobLocation || '',
    'Experience': exp,
    'Salary': job.salary || job.salaryLabel || job.salaryRange || '',
    'Posted': job.postedAt || job.datePosted || job.publishedAt || '',
    'Source': source,
    'Apply link': applyUrl(job)
  };
}

function selectBest(rows) {
  const seen = new Set();
  const unique = [];
  for (const r of rows) {
    const key = (r['Apply link'] || '').trim().toLowerCase() ||
      `${(r['Job title'] || '').toLowerCase()}|${(r['Company'] || '').toLowerCase()}`;
    if (seen.has(key)) continue;
    seen.add(key);
    unique.push(r);
  }
  return unique
    .filter(r => r['Match %'] >= MIN_MATCH)
    .sort((a, b) => b['Match %'] - a['Match %'])
    .slice(0, TOP_N);
}

function downloadExcel(rows) {
  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{
    'Match %': '',
    'Matched skills': '',
    'Job title': 'No matches',
    'Company': '',
    'Location': '',
    'Experience': '',
    'Salary': '',
    'Posted': '',
    'Source': '',
    'Apply link': ''
  }]);
  ws['!cols'] = [
    { wch: 10 }, { wch: 36 }, { wch: 36 }, { wch: 24 }, { wch: 18 },
    { wch: 14 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 55 }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Matching jobs');
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, (c) => (c === 'T' ? '_' : ''));
  XLSX.writeFile(wb, `matched_jobs_${stamp}.xlsx`);
}

async function startSearch() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const keywords = document.getElementById('keywords').value.trim();
  const location = document.getElementById('location').value.trim();
  const experience = document.getElementById('experience').value;
  const datePosted = document.getElementById('datePosted').value;
  const source = document.getElementById('source').value;
  const btn = document.getElementById('searchBtn');

  if (!apiKey) { setStatus('Enter your Apify API key first.', 'err'); return; }
  if (!keywords) { setStatus('Enter keywords to search for.', 'err'); return; }

  btn.disabled = true;
  setStatus(`Fetching jobs from ${source === 'both' ? 'LinkedIn and Naukri' : source}…`);

  let liJobs = [], nkJobs = [];
  try {
    const tasks = [];
    if (source === 'both' || source === 'linkedin') {
      tasks.push(runLinkedIn(apiKey, keywords, location, datePosted).then(r => { liJobs = r; }));
    }
    if (source === 'both' || source === 'naukri') {
      tasks.push(runNaukri(apiKey, keywords, location, experience).then(r => { nkJobs = r; }));
    }
    await Promise.all(tasks);

    setStatus('Scoring jobs against your resume…');
    const rows = [];
    liJobs.forEach(j => { const r = normalize(j, 'LinkedIn'); if (r) rows.push(r); });
    nkJobs.forEach(j => { const r = normalize(j, 'Naukri'); if (r) rows.push(r); });
    const best = selectBest(rows);

    downloadExcel(best);
    setStatus(
      `Done. Scraped ${rows.length} roles → ${best.length} best matches (≥${MIN_MATCH}%). Excel downloaded with apply links.`,
      'ok'
    );
  } catch (e) {
    setStatus(e.message || 'Something went wrong. Check your API key and try again.', 'err');
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('searchBtn').addEventListener('click', startSearch);
  </script>
</body>
</html>
